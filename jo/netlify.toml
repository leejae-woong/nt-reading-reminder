# 말씀 동행 (조원용 사이트). Netlify에서 Base directory를 jo 로 두고 연결한다.
[build]
  publish = "site"
  functions = "netlify/functions"
  # jo 폴더가 바뀐 커밋만 배포한다 (재웅·동규·준호 사이트나 알림 기록 커밋은 건너뜀)
  # (Netlify에 지난 빌드 기록이 없으면 바로 앞 커밋과 비교한다. 안 그러면 바뀐 게 없다고 보고 배포를 건너뛴다)
  ignore = "base=${CACHED_COMMIT_REF:-$COMMIT_REF}; [ \"$base\" = \"$COMMIT_REF\" ] && base=HEAD^; git diff --quiet $base $COMMIT_REF -- ."

[functions]
  node_bundler = "esbuild"
