name: 성경 읽기 알림

on:
  # 정시 실행은 cron-job.org가 workflow_dispatch로 호출한다 (아침 09:00, 저녁 21:00 KST).
  # 아래 예약 실행은 백업. GitHub 예약은 몇 시간씩 늦을 수 있어서, 늦으면 스스로 건너뛴다.
  schedule:
    - cron: "20 0 * * *"    # 한국 09:20
    - cron: "20 12 * * *"   # 한국 21:20
  workflow_dispatch:
    inputs:
      slot:
        description: "알림 종류"
        type: choice
        options: [morning, evening]
        default: morning
      test:
        description: "테스트: 오늘 기록했어도 모두에게 보내기"
        type: boolean
        default: false
      dry:
        description: "점검만: 실제로 보내지 않고 누구에게 갈지만 확인"
        type: boolean
        default: false

# 두 실행이 겹치면 차례로 돌게 해서 중복 전송을 막는다
concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node notify.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SLOT: ${{ inputs.slot }}
          TEST: ${{ inputs.test }}
          DRY_RUN: ${{ inputs.dry }}
          EVENT: ${{ github.event_name }}
      # 보낸 기록을 저장 (중복 방지 + 저장소가 매일 갱신돼서 예약 실행도 멈추지 않음)
      - name: 보낸 기록 저장
        run: |
          if [ -n "$(git status --porcelain sent)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent
            git commit -m "sent $(ls -t sent | head -1)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
