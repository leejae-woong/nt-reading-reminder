name: 성경 읽기 알림

on:
  schedule:
    # GitHub 예약 실행은 보통 몇 분 늦게 시작해서 10분 일찍 걸어둠 (UTC 기준)
    - cron: "50 23 * * *"   # 한국 08:50 → 아침 9시 무렵
    - cron: "50 11 * * *"   # 한국 20:50 → 저녁 9시 무렵
  workflow_dispatch:
    inputs:
      slot:
        description: "알림 종류"
        type: choice
        options: [morning, evening]
        default: morning
      test:
        description: "테스트: 오늘 기록했어도 모두에게 보내기"
        type: boolean
        default: false
      dry:
        description: "점검만: 실제로 보내지 않고 누구에게 갈지만 확인"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node notify.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SLOT: ${{ inputs.slot }}
          TEST: ${{ inputs.test }}
          DRY_RUN: ${{ inputs.dry }}
      # 공개 저장소는 60일 동안 변화가 없으면 예약 실행이 멈춰서, 일요일 아침마다 실행 날짜를 기록해 둔다
      - name: 예약 실행 유지 (일요일 아침)
        if: github.event_name == 'schedule' && github.event.schedule == '50 23 * * *'
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "7" ]; then
            TZ=Asia/Seoul date +%F > .last-run
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-run
            git commit -m "keepalive $(cat .last-run)" && git push || true
          fi
