# 신약 1독 체크표 사이트 (bible-practice, bible-main 둘 다 이 저장소에 연결)
[build]
  publish = "site"
  functions = "netlify/functions"
  # 알림 기록(sent/)만 바뀐 커밋은 사이트를 다시 배포하지 않는다
  # (Netlify에 지난 빌드 기록이 없으면 바로 앞 커밋과 비교한다. 안 그러면 바뀐 게 없다고 보고 배포를 건너뛴다)
  ignore = "base=${CACHED_COMMIT_REF:-$COMMIT_REF}; [ \"$base\" = \"$COMMIT_REF\" ] && base=HEAD^; git diff --quiet $base $COMMIT_REF -- site netlify netlify.toml"

[functions]
  node_bundler = "esbuild"
